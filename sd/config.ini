; Ikemen NX defaults for the Nintendo Switch. Ikemen GO completes this file
; with every other option the first time it runs. All of these can also be
; changed later with the Ikemen NX Config app (switch/nxconfig).
[Config]
; 0 = load portraits at boot (smooth select screen). Use 2 for big rosters
; (hundreds of characters) so the game starts sooner.
BootLoadingMode = 0

[Video]
RenderMode = OpenGL ES 3.2

[Sound]
; Stream music from the SD card. Decoding whole songs into RAM (1) can use
; 100-250 MB per song and run the game out of memory.
BGMRAMBuffer = 0
